# Prod / chạy trong Docker: mọi giá trị lấy từ biến môi trường, không có mặc định cho bí mật
# → thiếu biến thì khởi động lỗi ngay thay vì chạy với mật khẩu sai.
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS:true}
  devtools:
    add-properties: false

server:
  forward-headers-strategy: framework # Sau nginx: lấy scheme/host/IP từ X-Forwarded-* (luật cảnh báo IP cần IP thật)

localspot:
  app:
    public-url: ${APP_PUBLIC_URL}
  mail:
    from: ${MAIL_FROM}
  security:
    jwt:
      secret: ${JWT_SECRET}
