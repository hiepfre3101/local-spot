# Cấu hình chung mọi môi trường. Giá trị theo môi trường nằm ở application-{dev,prod}.yml.
spring:
  application:
    name: localspot
  profiles:
    default: dev
  datasource:
    hikari:
      data-source-properties:
        # Driver MySQL quy đổi thời gian theo UTC cho MỌI truy cập (JdbcTemplate, native query), khớp
        # hibernate.jdbc.time_zone bên dưới — nếu không, JDBC thuần dùng múi giờ JVM (+07) và lệch 7 giờ
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  jpa:
    open-in-view: false # Không giữ session tới view — buộc nạp dữ liệu trong service, lộ N+1 sớm
    hibernate:
      ddl-auto: validate # Schema do Flyway quản lý; Hibernate chỉ đối chiếu
    properties:
      hibernate:
        jdbc:
          time_zone: UTC # DATETIME(6) lưu UTC (docs/design/database.md §1)
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      # NFR-09: ≤ 5 MB / ảnh, ≤ 10 ảnh / request (+ phần JSON) — khớp client_max_body_size 55m của nginx.
      # Vượt → 413 PAYLOAD_TOO_LARGE trước khi vào controller
      max-file-size: 5MB
      max-request-size: 55MB
  mail:
    default-encoding: UTF-8
  cache:
    type: redis # Spring Cache (plan §2) — danh sách cache và kiểu dữ liệu khai báo ở CacheConfig
  data:
    redis:
      # Redis chỉ phụ trợ (rate limit cho qua khi Redis sập — D8): lệnh treo không được kéo request theo
      # (mặc định Lettuce chờ 60 s)
      timeout: 500ms
      connect-timeout: 500ms
  rabbitmq:
    listener:
      simple:
        # NFR-13: lỗi tác vụ nền (gửi mail...) được thử lại rồi chuyển sang dead-letter queue, không làm hỏng request
        default-requeue-rejected: false # hết lượt retry → reject không requeue → DLX
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 2s
          multiplier: 3
          max-interval: 30s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Tham số nghiệp vụ LocalSpot (bind vào *Properties trong com.localspot.config)
localspot:
  security:
    jwt:
      issuer: localspot
      access-token-ttl: 15m # NFR-06
      # secret: theo profile — base64 của ≥ 32 byte ngẫu nhiên (HS256)
    email-verification-ttl: 24h # U1
    password-reset-ttl: 30m # U1
    refresh-token:
      ttl: 7d # NFR-06
      cookie-name: refresh_token
      cookie-path: /api/v1/auth # S1: trình duyệt chỉ gửi cookie tới các endpoint auth
      cookie-secure: true
  app:
    # URL trang web (frontend) — link trong email trỏ về đây: /verify-email?token=, /reset-password?token= (sitemap)
    public-url: http://localhost:5173
  mail:
    from: "LocalSpot <no-reply@localspot.test>"
  # requirements §5.1 — đặt ở đây để thử nghiệm với dữ liệu seed và báo cáo ở Chương 5
  trust:
    base: 10 # chỉ cộng khi đã xác thực email
    age-weight: 1
    age-days-per-point: 7
    age-cap: 18
    helpful-weight: 2
    helpful-cap: 36
    penalty-weight: 3
    publish-threshold: 30
  # Chống review ảo khi viết review (FR-23, requirements §5, U3) — ngưỡng trust ở localspot.trust.publish-threshold
  review:
    max-per-window: 5 # đếm trong CSDL, cả review đã xóa
    window: 24h
    ip-alert-count: 3 # địa điểm đã nhận ≥ 3 review từ cùng /24 (IPv6: /64) trong 24 giờ → review kế tiếp vào hàng chờ
    ip-window: 24h
  # Ảnh địa điểm / review (FR-16, NFR-09). maxPerPlace chốt 2026-10-06
  photo:
    max-per-request: 10
    max-per-place: 30
    max-per-review: 10 # tổng ảnh mỗi review, kể cả thêm sau khi viết (chốt 2026-10-09)
    max-file-size: 5MB
    max-pixels: 40000000 # ~ 7300 × 5500 — đủ cho ảnh điện thoại, chặn ảnh "bom giải nén"
    jpeg-quality: 0.8
    thumb-size: 320
    medium-size: 960
    large-size: 1920
  # Kho ảnh tương thích S3; endpoint / khóa / URL công khai theo profile
  storage:
    region: us-east-1 # MinIO bỏ qua; R2 dùng "auto"
    bucket: localspot
    path-style-access: true
    create-bucket: false
  # Meilisearch (FR-09); host / api-key theo profile. Tham số so khớp chốt 2026-10-08 (đo trên dữ liệu tiếng Việt)
  search:
    index: places
    # Mặc định của Meilisearch: không khớp đủ thì bỏ từ cuối trước. "frequency" bị loại vì trả rỗng cho truy vấn thường
    # ("pho bat dan ngon"). Từ chung chung đầu truy vấn ("quán", "tiệm") do SearchQueries bỏ trước khi gửi
    matching-strategy: last
    # 1 lỗi chính tả từ 4 ký tự (mặc định 5): âm tiết tiếng Việt ngắn — "bunn cha", "phoo thin" thì 5 trả rỗng
    one-typo-min-word-size: 4
    two-typo-min-word-size: 8
    retry-after-failure: 30s # Meilisearch lỗi → fallback MySQL LIKE (U9) trong khoảng này rồi mới thử lại
    reindex-on-startup: true
  # NFR-10 — cửa sổ trượt; ngưỡng chốt 2026-10-04 (login theo U2). Giới hạn 5 review / 24 giờ (FR-23) đếm trong CSDL.
  rate-limit:
    policies:
      login: { limit: 5, window: 15m } # theo (email, IP); đăng nhập đúng xóa bộ đếm
      register: { limit: 10, window: 1h } # theo IP — nới vì nhiều máy chung một IP
      forgot-password-email: { limit: 3, window: 1h }
      forgot-password-ip: { limit: 20, window: 1h }
      resend-verification: { limit: 3, window: 1h } # theo tài khoản
