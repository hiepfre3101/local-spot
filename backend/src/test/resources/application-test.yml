# Profile test (Testcontainers cung cấp datasource / RabbitMQ / Redis qua @ServiceConnection)
spring:
  mail:
    host: localhost # JavaMailSender được tạo; test mail thay bằng mock (@MockitoBean)
    port: 3025
  rabbitmq:
    listener:
      simple:
        # Consumer chỉ chạy ở test bật riêng (MailFlowTests) — test khác không gửi mail thật
        auto-startup: false
        retry:
          initial-interval: 100ms
          max-interval: 200ms

management:
  health:
    mail:
      enabled: false # test không có SMTP thật; MailFlowTests thay JavaMailSender bằng mock

